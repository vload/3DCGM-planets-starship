start_point_factor = 5.2
end_point_factor = 5.4
path_points_list = [
    [[10.0, 0.0, 10.0], [20.0, 0.0, 30.0], 5.0],
    [[-10.0, 0.0, 20.0], [30.0, 0.0, -20.0], 5.1],
    [[30.0, -2.0, 30.0], [20.0, 0.0, 40.0], 5.3],
]

[shadows]
enable_eclipse_shadows = true
enable_shaddow_mapping_planets = true
shadow_map_size = 2048

